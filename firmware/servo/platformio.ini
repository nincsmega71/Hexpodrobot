; Hexpodrobot – busz-szervó firmware (CH32V003F4U6)
; VS Code + PlatformIO, platform: Community-PIO-CH32V
; Feltöltés: WCH-LinkE programozó, SWIO láb.

[platformio]
default_envs = ds3218

[env]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4U6
framework = noneos-sdk
upload_protocol = wch-link
build_flags = -Os

; Comb és lábszár
[env:ds3218]
build_flags = ${env.build_flags} -DMODEL_NUMBER=0x0301

; Csípő és héjszeletek
[env:mg996r]
build_flags = ${env.build_flags} -DMODEL_NUMBER=0x0302
